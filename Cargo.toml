# Weft toolchain workspace. The compiler, language server, formatter and CLI
# are Rust crates; the runtime, server and data packages (packages/) are
# TypeScript and live outside this workspace.
[workspace]
resolver = "2"
members = [
    "crates/weft-compiler",
    "crates/weft-cli",
    "crates/weft-fmt",
    "crates/weft-lsp",
]

[workspace.package]
version = "0.0.7"
edition = "2021"
license = "MIT"
authors = ["Vakea <alex.leroy8303@seznam.cz>"]
repository = "https://github.com/weft-framework/weft"
homepage = "https://weft-framework.github.io/weft/"
rust-version = "1.80"

[workspace.dependencies]
weft-compiler = { path = "crates/weft-compiler" }
weft-fmt = { path = "crates/weft-fmt" }
weft-lsp = { path = "crates/weft-lsp" }

[profile.release]
lto = "thin"
codegen-units = 1

name: Something's broken
description: Weft did something it shouldn't, or didn't do something it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. A small example that shows the problem is the most useful thing
        you can give me. Most bugs get fixed the same day there's a way to see them happen.

        If this is a security problem, please don't post it here. See [SECURITY.md](https://github.com/weft-framework/weft/blob/main/SECURITY.md) for how to report it privately.

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        I ran `npm run dev`, opened /blog and clicked the counter.
        I expected the number to go up. Instead the page reloaded and the count went back to 0.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How can I see it myself?
      description: |
        The shortest steps or the smallest `.wx` file that shows it. A link to a repository works too.
      render: wx
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Error output
      description: Anything from the terminal or the browser console. Paste it as text, not a screenshot.
      render: text

  - type: input
    id: weft
    attributes:
      label: Weft version
      description: The output of `npx weft version`.
      placeholder: weft 0.0.1
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Something else (say which below)
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Node or Bun version
      description: The output of `node --version` or `bun --version`.
      placeholder: v24.11.0

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Browser, database, what you already tried, a hunch about the cause. All welcome.
